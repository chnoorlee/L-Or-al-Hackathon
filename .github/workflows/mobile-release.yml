name: Build mobile release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match package version)
        required: true
        default: v0.8.0
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm run verify
      - run: npm run web:assets
      - run: npm run web:build -- --base /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundled-web
          path: dist/web
          retention-days: 7

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bundled-web
          path: dist/web
      - run: npx cap sync android
      - name: Build signed APK and app bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/even-tone-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/EvenTone-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../release/EvenTone-Android.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-release
          path: release
          retention-days: 14

  ios:
    needs: web
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bundled-web
          path: dist/web
      - run: npx cap sync ios
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Build unsigned iPhone app and simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1 || { tail -100 device-build.log; exit 1; }
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -100 simulator-build.log; exit 1; }
          mkdir -p release package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app package/Payload/
          (cd package && zip -qry ../release/EvenTone-iOS-UNSIGNED.ipa Payload)
          ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Release-iphonesimulator/App.app release/EvenTone-iOS-Simulator.zip
      - name: Launch in iOS simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith('iPhone'));if(!d)process.exit(1);console.log(d.udid)})")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE_ID" com.chnoorlee.eventone
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot release/iOS-Simulator.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release
          path: release
          retention-days: 14

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Package build sources and checksums
        run: |
          git archive --format=zip --output=release/EvenTone-Source.zip HEAD
          cp docs/mobile-v0.8.md release/INSTALL.md
          cd release
          sha256sum *.apk *.aab *.ipa *.zip *.png INSTALL.md > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "EVEN TONE $RELEASE_TAG · 网页与移动端预览" --notes-file docs/mobile-v0.8.md --prerelease
